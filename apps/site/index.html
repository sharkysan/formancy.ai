<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>formancy.ai — Visual form builder for Angular and React</title>
    <meta
      name="description"
      content="Open-source visual form builder for Angular and React. Paid modules: forms over your PostgreSQL or SQL Server database, PDF and Word invoices, healthcare forms."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#080a12" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://formancy.ai/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- How the page looks when it is shared: Open Graph, then Twitter/X. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="formancy.ai" />
    <meta property="og:locale" content="en" />
    <meta property="og:url" content="https://formancy.ai/" />
    <meta property="og:title" content="formancy.ai — Visual form builder for Angular and React" />
    <meta
      property="og:description"
      content="A visual form builder for Angular and React, open source, with an optional self-hosted backend. Paid modules add forms over your PostgreSQL or SQL Server database, PDF and Word documents and invoices, and healthcare forms."
    />
    <meta property="og:image" content="https://formancy.ai/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="formancy.ai: build the form, ship your product. A visual form builder for Angular and React, with one registration form shown in two of its themes."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="formancy.ai — Visual form builder for Angular and React" />
    <meta
      name="twitter:description"
      content="A visual form builder for Angular and React, open source. Paid modules add forms over your PostgreSQL or SQL Server database, PDF and Word documents and invoices, and healthcare forms."
    />
    <meta name="twitter:image" content="https://formancy.ai/og.png" />

    <!-- What the page is, for search engines. Nothing here that the page or the
         repository does not also say: no ratings, no prices beyond the licence.
         After formancy, the paid modules the page's #modules section shows, each by the
         @id, address and description its product page gives its SoftwareApplication, so
         the two pages describe one thing. Nothing here says they are free: they are not
         in production (0179, 0242). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://formancy.ai/#website",
            "url": "https://formancy.ai/",
            "name": "formancy.ai",
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareSourceCode",
            "@id": "https://formancy.ai/#software",
            "name": "formancy",
            "description": "An open-source visual form builder for Angular and React, with conditional fields, validation, custom styling and an optional self-hosted backend.",
            "url": "https://formancy.ai/",
            "codeRepository": "https://github.com/sharkysan/formancy.ai",
            "license": "https://www.apache.org/licenses/LICENSE-2.0",
            "programmingLanguage": "TypeScript",
            "runtimePlatform": "Node.js",
            "keywords": "form engine, form builder, React forms, Angular forms, JSON forms, CEL, self-hosted, accessibility",
            "isAccessibleForFree": true,
            "image": "https://formancy.ai/og.png"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://formancy.ai/products/data/#software",
            "name": "Formancy Data",
            "url": "https://formancy.ai/products/data/",
            "description": "Turn an existing PostgreSQL or SQL Server database into forms in your React or Angular app, generated from what an account may do, under your rules."
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://formancy.ai/products/report/#software",
            "name": "Formancy Report",
            "url": "https://formancy.ai/products/report/",
            "description": "Invoices with a Swiss QR-bill or EPC QR code, e-invoices, quotations and sales reports with charts, designed in your app and printed as PDF or Word."
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://formancy.ai/products/health/#software",
            "name": "Formancy Health",
            "url": "https://formancy.ai/products/health/",
            "description": "Export formancy forms and answers as HL7® FHIR® R4 SDC resources, PDFs in a FHIR document Bundle, and Swiss referrals as CH ORF on CH Core."
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The page is in the HTML the server sends (0243); what needs the script is said here,
         for a browser that runs none, as the templates and Angular pages say theirs. -->
    <noscript>Without JavaScript you can read this page, but its forms do not respond, and the submission at its end stays empty.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
