<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080a12" />
    <title>formancy.ai playground — edit a form, watch the engine</title>
    <meta
      name="description"
      content="Edit a formancy form document and watch the form, the rules and the submission value follow as you type. Switch theme and language live. Runs entirely in your browser."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- The one page of formancy.ai that renders documents somebody else wrote — a
         visitor pasting one in, or a model — and an option's picture may name any
         https host (0126). So pictures and connections are held to this origin and to
         data: and blob: addresses, which carry bytes the page already holds; a document
         pointing anywhere else shows a broken picture rather than telling that host who
         opened it. Deliberately this narrow: a style-src policy collides with the inline
         styles the renderers and Monaco set, and is separate work (0154). -->
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob:; connect-src 'self'" />
    <link rel="canonical" href="https://formancy.ai/playground/" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <meta property="og:site_name" content="formancy.ai" />
