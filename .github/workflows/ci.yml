name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only, for every job. Nothing in this workflow writes to the repository:
# the coverage upload authenticates with its own token and the caches are the
# runner's. Without this the default token carries whatever the repository's
# default is, which is write on an older setting -- and CodeQL says so, as a
# `actions/missing-workflow-permissions` alert per job. Three jobs here had been
# carrying that alert and a fourth made it a failing check on the pull request
# that added it, which is the gate working.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # corepack reads the packageManager field, so CI runs the exact pnpm
      # version the repo pins rather than whatever the runner image ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      # `pnpm build` does not build the site the way the host builds it, and the
      # difference was not academic: `build:web` composes the landing page, the
      # playground and the docs under one origin, and it carries the check for
      # root-absolute documentation links -- which resolve against the landing
      # page rather than `/docs/`, build cleanly, and 404 in production. That
      # check lived here for a while as a script nothing ran, so two links
      # shipped and were found by the deploy log instead of by CI. A guard that
      # is not a gate is a comment.
      - run: pnpm build:web
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      # Packaging correctness (publint + attw) is a release gate, not a nicety:
      # broken exports maps are the top cause of "doesn't work in my app" for
      # multi-framework libraries.
      - run: pnpm check:pkg

      # Apache-2.0 section 4(a) requires the licence to travel with the work and
      # 4(d) the NOTICE, and `npm publish` is perfectly happy to ship a tarball
      # with neither. This ran only in the release workflow, which is the last
      # possible moment: the two Angular packages pack from `dist`, which is
      # turbo's cached output for `build`, so the files were written after the
      # build task finished and any later restore of it took them away again.
      # The release gate caught that and stopped — correctly, and far too late
      # to be useful. It belongs on the pull request.
      - run: node scripts/verify-licenses.mjs

  # Every job above runs inside the workspace, against the tree it built from —
  # and a workspace sibling resolves a package through a symlink to its SOURCE
  # directory. So an exports map that is wrong for a real consumer can be right
  # for every test in the repository, which is how @formancy/builder-angular
  # shipped with no exports at all for four releases: ninety-five of its own
  # tests import by relative path, and publint reads the manifest ng-packagr
  # generates.
  #
  # This packs the tarballs, installs them into a plain npm project, type-checks
  # it with skipLibCheck OFF, runs it under Node and builds it with Vite. Its own
  # job rather than a step in `verify`, following `container`: it is about the
  # ARTEFACT rather than the tree, and keeping it separate means `verify` stays
  # the fast signal.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The tarballs are built output, so there is nothing to pack without this.
      - run: pnpm build

      - run: pnpm test:e2e:install

  # What jsdom structurally cannot see. jsdom applies no CSS, resolves no media
  # queries and performs no layout -- every box measures zero and every cascade
  # question has no answer. Two defects shipped through every other gate here in
  # one week for exactly that reason: an inline style that outranked a media
  # query, so the page scrolled sideways by 187px on a tablet (0100); and
  # `touch-action` that lived only in the shipped themes, so signing with a
  # finger panned the page (0101). Reverting either one reddens this job.
  #
  # Its own job rather than part of `verify`, for the same reason the CLA check is
  # its own workflow: "browser" says what is wrong, where a red "verify" sends the
  # reader into a twenty-minute log to find out.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The gate runs against the composed site a host serves, not a dev server,
      # so both builds are the subject rather than setup.
      - run: pnpm build
      - run: pnpm build:web

      # Cached by the lockfile, which pins the playwright version the browser
      # revision is tied to -- a mismatch is the one failure here that would look
      # like a defect in the page.
      - name: Cache the Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:browser

  # The image is the product for a self-hoster, and nothing else here touches
  # it. The static check in `dockerfile.test.ts` catches a workspace package
  # the COPY list forgot; this catches everything it cannot — a dependency
  # that needs a postinstall, a file the runtime stage drops, a Node version
  # that stops resolving something. It has already been needed once: the image
  # built cleanly, passed every test, and exited on startup with
  # ERR_MODULE_NOT_FOUND.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the server image
        run: docker build -f packages/server/Dockerfile -t formancy/server:ci .

      - name: It has to actually start
        run: |
          # Pointed at a database that is not there. What is being proved is
          # that the process gets as far as TRYING to connect: a module it
          # cannot find, or a missing file, fails earlier and differently.
          output=$(docker run --rm             -e DATABASE_URL=postgres://u:p@127.0.0.1:1/db             -e FORMANCY_AUTH_SECRET=0123456789012345678901234567890123             formancy/server:ci 2>&1 || true)

          echo "$output"

          if echo "$output" | grep -q 'ERR_MODULE_NOT_FOUND\|Cannot find module\|MODULE_NOT_FOUND'; then
            echo "::error::The image is missing a module at runtime. The build said nothing."
            exit 1
          fi

          if ! echo "$output" | grep -q 'ECONNREFUSED'; then
            echo "::error::The server did not reach the database connection. It failed earlier than expected."
            exit 1
          fi

      - name: And say so loudly when there is no signing key
        run: |
          # It does not refuse — it generates an ephemeral key and warns, so
          # `docker compose up` works for somebody trying the product. The
          # warning is the contract: sessions die on restart, and an operator
          # who never sees it will not know why people keep getting logged out.
          if docker run --rm -e DATABASE_URL=postgres://u:p@127.0.0.1:1/db formancy/server:ci 2>&1               | grep -q 'sessions will not survive a restart'; then
            exit 0
          fi
          echo "::error::The image no longer warns about a missing FORMANCY_AUTH_SECRET."
          exit 1
