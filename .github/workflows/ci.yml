name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # corepack reads the packageManager field, so CI runs the exact pnpm
      # version the repo pins rather than whatever the runner image ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      # Packaging correctness (publint + attw) is a release gate, not a nicety:
      # broken exports maps are the top cause of "doesn't work in my app" for
      # multi-framework libraries.
      - run: pnpm check:pkg
