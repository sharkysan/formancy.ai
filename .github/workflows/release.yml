name: Release

# Publishing happens here and nowhere else. A release cut from a laptop cannot
# carry provenance — the attestation is a statement by GitHub about which
# workflow, at which commit, produced the tarball, and only the workflow can
# make it.
on:
  push:
    tags: ['v*']

# Third-party actions are pinned to commit hashes, with the tag in a comment.
#
# This workflow holds an npm token, an OIDC identity that can sign on the
# project's behalf, and push rights to the registry. A tag is a mutable pointer:
# whoever controls an action's repository can move `v3` to different code, and
# that code would run here with all three. CodeQL flagged the three added with
# the image work; the two that were already here are pinned in the same commit,
# because the argument does not distinguish them.
#
# Updating one means reading what changed and writing a new hash. That is the
# cost, and it is also the point.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC, for npm provenance and keyless signing
      packages: write # push the server image to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tag's history, so the release notes can reference it

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile

      # Before anything expensive. A token problem discovered after eight
      # minutes of build and test is the same token problem, found later.
      - name: The npm token must work, and must not want an OTP
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set on this repository"
            exit 1
          fi
          WHO=$(npm whoami 2>&1) || {
            echo "::error::npm rejected the token: ${WHO}"
            exit 1
          }
          echo "Authenticated as ${WHO}"
          # A classic "Publish" token on an account set to auth-and-writes
          # demands a one-time password for every publish, and CI has no
          # terminal to type one into — it fails with ERR_PNPM_OTP_NON_INTERACTIVE
          # AFTER the whole gate has run. Automation and granular tokens bypass
          # 2FA; this is the cheap way to notice which one is in the secret.
          if npm profile get 2>/dev/null | grep -q "auth-and-writes"; then
            echo "::warning::Account enforces 2FA on writes. The token must be an \
          Automation or Granular Access token, or publish will fail. See RELEASING.md."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The tag is the claim; this checks the repository agrees with it. A tag
      # that says v0.1.0 on a tree that says 0.2.0 would publish the wrong
      # version under the right name, which is unfixable after the fact.
      - name: The tag and the manifests must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/core/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag is $TAG but the packages say $PKG"
            exit 1
          fi
          echo "Releasing $PKG"

      # The same gates CI runs. A release must not be the first time they run
      # against this tree.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:pkg

      # Apache-2.0 4(a) and 4(d). scripts/sync-licenses.mjs puts them in place
      # during build; this refuses to publish if they did not land.
      - name: Every tarball carries its licence
        run: node scripts/verify-licenses.mjs

      - name: Publish to npm with provenance
        run: pnpm publish -r --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # A bill of materials for what actually ships, so a consumer — or an
      # auditor — can answer "what is in this" without resolving it themselves.
      #
      # --required-only because an SBOM for a released artefact should describe
      # the artefact, not the workbench. It keeps every runtime dependency
      # (verified: cel-js, noble/hashes, node-rs/argon2, ajv, fastify,
      # drizzle-orm, jose, postgres) and drops the test tooling — 71 components
      # rather than 1067.
      - name: Generate a CycloneDX SBOM
        run: |
          npx --yes @cyclonedx/cdxgen@12.8.4 \
            --type javascript \
            --required-only \
            --output "formancy-${GITHUB_REF_NAME}-sbom.cdx.json" \
            --project-name formancy \
            --project-version "${GITHUB_REF_NAME#v}" \
            .
          node -e "
            const s = require('./formancy-${GITHUB_REF_NAME}-sbom.cdx.json');
            const purls = (s.components ?? []).map((c) => c.purl ?? '').join('\n');
            // The evaluator decides whether a submission is valid. An SBOM that
            // omitted it would be worse than none, so the release stops here.
            if (!purls.includes('%40marcbachmann/cel-js')) {
              console.error('::error::SBOM is missing the CEL evaluator');
              process.exit(1);
            }
            console.log('SBOM: ' + String((s.components ?? []).length) + ' components');
          "

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless: the signature is bound to this workflow's OIDC identity rather
      # than to a private key somebody has to keep. There is no key to leak and
      # no key to lose.
      - name: Sign the SBOM
        run: |
          cosign sign-blob --yes \
            --bundle "formancy-${GITHUB_REF_NAME}-sbom.cdx.json.sigstore" \
            "formancy-${GITHUB_REF_NAME}-sbom.cdx.json"

      # ── The server image ────────────────────────────────────────────────
      #
      # CI builds this image on every pull request and proves it starts. Until
      # now the release threw it away, so a self-hosted product whose npm
      # packages carry provenance had no published image at all — which asks
      # people to build it themselves and calls that a supply chain.
      #
      # Built here rather than reusing CI's: an image somebody deploys should be
      # produced by the workflow that signs it, at the commit the tag names, and
      # not carried between jobs where the thing signed and the thing built could
      # drift apart.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest`, deliberately. The SOUP declaration tells a manufacturer to
      # pin an exact version and says in as many words that `latest` is not
      # characterised software; publishing one anyway would be this project
      # contradicting its own advice in the most convenient place to do it.
      - name: Build and push the server image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/formancy-server:${{ github.ref_name }}
          # GitHub's own build provenance, which is the same statement the npm
          # tarballs carry: this workflow, at this commit, produced these bytes.
          provenance: mode=max

      # By DIGEST, never by tag. A tag is mutable, so signing `:v1.2.3` says
      # nothing about the bytes anybody later pulls under that name — and being
      # about the bytes is the entire point of the signature.
      - name: Sign the image
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/formancy-server@${{ steps.image.outputs.digest }}"

      # The SBOM is already built and signed as a file on the release page. A
      # file beside a download is a file somebody has to know to look for; an
      # attestation travels with the image, and `cosign verify-attestation` finds
      # it without being told where.
      - name: Attach the SBOM to the image
        run: |
          cosign attest --yes \
            --type cyclonedx \
            --predicate "formancy-${GITHUB_REF_NAME}-sbom.cdx.json" \
            "ghcr.io/${{ github.repository_owner }}/formancy-server@${{ steps.image.outputs.digest }}"

      - name: Say which image this release is
        run: |
          {
            echo "### Container image"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/formancy-server:${GITHUB_REF_NAME}"
            echo "digest: ${{ steps.image.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: CHANGELOG.md
          files: |
            formancy-*-sbom.cdx.json
            formancy-*-sbom.cdx.json.sigstore
          fail_on_unmatched_files: true
