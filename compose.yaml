# `docker compose up -d` gives you the whole product: a database and the server.
#
# It will refuse to start until you have secrets. That is deliberate — see
# .env.example, which explains how to make them in one command. A form platform
# that boots with a signing key printed in its own repository is a form platform
# anyone who has read the repository can sign a session for.
#
# For development against the source instead, run only the database
# (`docker compose up -d postgres`) and start the server with
# `pnpm --filter @formancy/server dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: formancy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formancy}
      POSTGRES_DB: formancy
    ports:
      # Bound to loopback, not to every interface. The default `5439:5432`
      # publishes the database to the whole network, which on a laptop on a
      # café network is a database on a café network.
      #
      # 5439 rather than 5432 because a locally installed Postgres usually has
      # 5432, and a silent collision looks exactly like a wrong password.
      - "127.0.0.1:5439:5432"
    volumes:
      - formancy-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formancy"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      # Every interface, which is right with nothing in front. Behind a reverse
      # proxy, publish nothing: this port is a way around the proxy, and Docker
      # hands connections to it over from the network's gateway -- those from
      # this machine and from other containers, measured. See
      # FORMANCY_TRUST_PROXY below and the self-hosting guide.
      - "4380:4380"
    environment:
      DATABASE_URL: postgres://formancy:${POSTGRES_PASSWORD:-formancy}@postgres:5432/formancy

      # `:?` means compose stops with this message rather than starting an
      # insecure server. There is no default, here or in the image.
      FORMANCY_AUTH_SECRET: ${FORMANCY_AUTH_SECRET:?set it in .env — see .env.example}

      # The first admin, created only while no user exists. Also no default: an
      # admin password that ships in a repository is not a password.
      FORMANCY_ADMIN_EMAIL: ${FORMANCY_ADMIN_EMAIL:?set it in .env — see .env.example}
      FORMANCY_ADMIN_PASSWORD: ${FORMANCY_ADMIN_PASSWORD:?set it in .env — see .env.example}

      # Webhook delivery refuses plain http and private addresses by default,
      # which is what stops a form author pointing the server at the cloud
      # metadata service. Both are opt-in, for a receiver on a trusted network.
      # Passed through only if you set it, which is why there is no `${...}` here.
      # The challenge is opt-in and the server refuses to start on a secret
      # shorter than 32 characters — so `${FORMANCY_CHALLENGE_SECRET:-}`, the
      # obvious spelling, resolves to the empty string when unset and takes the
      # whole deployment down for everybody who did not want a challenge.
      # Measured both: a bare key reads `.env` when it is there and leaves the
      # variable genuinely absent when it is not.
      FORMANCY_CHALLENGE_SECRET:
      # An S3-compatible object store instead of the volume below, for a
      # deployment with more than one replica. Bare keys, so each is passed
      # through only when it is set: the endpoint being unset is how the server
      # knows to use local disk. Switching also takes `FORMANCY_FILES_DIR=""` in
      # `.env` -- see that variable below.
      FORMANCY_S3_ENDPOINT:
      FORMANCY_S3_BUCKET:
      FORMANCY_S3_REGION:
      FORMANCY_S3_ACCESS_KEY_ID:
      FORMANCY_S3_SECRET_ACCESS_KEY:
      # A ClamAV daemon to scan uploads with. Bare keys for the same reason: unset is
      # how the server knows no file is scanned.
      FORMANCY_CLAMD_HOST:
      FORMANCY_CLAMD_PORT:
      FORMANCY_CLAMD_MAX_BYTES:
      # The reverse proxy in front, so the rate limits count respondents rather
      # than the proxy: its own address, never this network's range, which holds
      # the gateway. A bare key for the same reason: unset is how the server
      # knows to trust no proxy.
      FORMANCY_TRUST_PROXY:
      # How much the server logs to standard output, which `docker compose logs server`
      # reads: a line per request and per error, never a body, a header or an answer.
      # A bare key for the same reason as the others: unset is how the server knows to
      # log at info, and `off` is the only way to keep no log.
      FORMANCY_LOG_LEVEL:
      # A model for the builders, asked through this server so its key never reaches a
      # browser. Bare keys, so each is passed through only when it is set: all three unset
      # is how the server knows there is no model, and a half configuration is refused at
      # startup. See .env.example for what each request sends, and to whom.
      FORMANCY_MODEL_PROVIDER:
      FORMANCY_MODEL_API_KEY:
      FORMANCY_MODEL:

      FORMANCY_WEBHOOK_ALLOW_HTTP: ${FORMANCY_WEBHOOK_ALLOW_HTTP:-false}
      FORMANCY_WEBHOOK_ALLOW_PRIVATE: ${FORMANCY_WEBHOOK_ALLOW_PRIVATE:-false}

      # Uploads are off until there is somewhere to put bytes. Pointed at the
      # volume below, so they survive the container — a files directory
      # inside a container's own filesystem is a directory that is deleted on
      # the next deploy.
      #
      # `-`, not `:-`: the volume when `.env` leaves this out, and empty when
      # `.env` says `FORMANCY_FILES_DIR=""`, which the server reads as no
      # directory. That is how the object store above is switched on -- compose
      # can blank a variable but not drop one, and a server told about two stores
      # refuses to start. Written as a literal path, it restart-looped for
      # everybody who followed the object-store block of .env.example.
      FORMANCY_FILES_DIR: ${FORMANCY_FILES_DIR-/var/lib/formancy/files}
      FORMANCY_MAX_FILE_BYTES: ${FORMANCY_MAX_FILE_BYTES:-10485760}
    volumes:
      - formancy-files:/var/lib/formancy/files
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  formancy-pg:
  formancy-files:
