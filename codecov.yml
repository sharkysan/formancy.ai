# Codecov. GENERATED by scripts/codecov-config.mjs -- do not edit.
#
# Run "node scripts/codecov-config.mjs --write" after adding a package.
# apps/docs/src/codecov.test.ts fails until the committed file matches what
# that produces, and names the command. The reasoning lives in the generator,
# because a comment written here survives exactly until the next run.
#
# COVERAGE IS REPORTED HERE, NEVER GATED, and this file is what holds that
# against Codecov, whose defaults do the opposite: with no configuration it
# posts project and patch statuses against an "auto" target, so a pull request
# that lowers the number carries a failing check. That is a threshold, and
# vitest.coverage.ts deliberately has none -- a percentage is a number
# somebody can raise without raising confidence, and the exclusions in that
# file exist so the figure means something rather than so it looks good.
# Every status below is informational: it reports the movement and blocks
# nothing.
#
# Measured against a real report rather than guessed at. The comment on pull
# request #145 read "Patch coverage is 87.87879% ... Please review", with a
# red cross: a number to five decimal places, framed as a failure, for a
# metric this repository does not gate on, and with no indication which of
# nineteen packages it belonged to. The precision, informational and component
# settings below are each an answer to one part of that sentence.

codecov:
  # The report describes a commit CI has finished with. Without this a comment
  # can arrive mid-run against a partial upload and then correct itself, which
  # reads as the number moving when it is the report arriving.
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  # One decimal, rounded down. The default printed 87.87879%, which claims a
  # precision the measurement does not have and is harder to compare by eye.
  precision: 1
  round: down
  range: "60...95"
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# One component per package that produces coverage, so the report says WHICH
# of them moved. Without this it is one number for the whole workspace, and a
# renderer losing coverage looks exactly like the server gaining it.
component_management:
  default_rules:
    statuses:
      - type: project
        informational: true
  individual_components:
    - component_id: angular
      name: packages/angular
      paths:
        - packages/angular/**
    - component_id: builder-angular
      name: packages/builder-angular
      paths:
        - packages/builder-angular/**
    - component_id: builder-core
      name: packages/builder-core
      paths:
        - packages/builder-core/**
    - component_id: builder-react
      name: packages/builder-react
      paths:
        - packages/builder-react/**
    - component_id: challenge
      name: packages/challenge
      paths:
        - packages/challenge/**
    - component_id: conformance
      name: packages/conformance
      paths:
        - packages/conformance/**
    - component_id: core
      name: packages/core
      paths:
        - packages/core/**
    - component_id: expressions
      name: packages/expressions
      paths:
        - packages/expressions/**
    - component_id: mcp
      name: packages/mcp
      paths:
        - packages/mcp/**
    - component_id: react
      name: packages/react
      paths:
        - packages/react/**
    - component_id: server
      name: packages/server
      paths:
        - packages/server/**
    - component_id: server-core
      name: packages/server-core
      paths:
        - packages/server-core/**
    - component_id: spec
      name: packages/spec
      paths:
        - packages/spec/**
    - component_id: tiptap
      name: packages/tiptap
      paths:
        - packages/tiptap/**
    - component_id: app-admin
      name: apps/admin
      paths:
        - apps/admin/**
    - component_id: app-docs
      name: apps/docs
      paths:
        - apps/docs/**
    - component_id: app-playground
      name: apps/playground
      paths:
        - apps/playground/**
    - component_id: app-site
      name: apps/site
      paths:
        - apps/site/**

comment:
  # Components first, because "which package" is the question a reader has, and
  # the per-file table after it because that is the detail. The default layout
  # leads with a sunburst graph and ends with a feedback link.
  layout: "condensed_header, components, condensed_files"
  behavior: default
  # Comment even when nothing moved: a report that appears only on a drop is a
  # report whose absence has two meanings.
  require_changes: false

# Nothing is ignored here, deliberately. What is left out of the measurement --
# barrels, composition roots, generated and declaration files -- is left out in
# vitest.coverage.ts, where the argument for each exclusion is written down, so
# it never reaches the uploaded report at all. A second list here would be one
# decision in two places, which is the thing this repository exists to prevent.
